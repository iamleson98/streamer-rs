name: ci

# Formatting, lints, the test suite, a dependency audit and a build of the render image (so a broken
# page or worker build is caught before a tag, not by the release). Every cargo command uses --locked.
# The toolchain is the one in rust-toolchain.toml. The render image and the tests of board-draw (the
# pinned fonts) need the lesson-replay submodule. board-draw links Skia, whose prebuilt binary is
# fetched and checked by crates/board-draw/skia-binaries.sh (never by the build itself) and which
# needs the system's FreeType and fontconfig.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # image.yml runs the whole suite as the gate of a release.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Not ${{ github.workflow }}: called from image.yml that is the caller's name, which is also
  # the start of the caller's own concurrency group.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: Format and lints
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfreetype-dev libfontconfig-dev
      - name: Pinned Skia binaries
        run: crates/board-draw/skia-binaries.sh "$RUNNER_TEMP/skia"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - name: Toolchain
        run: rustup toolchain install
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfreetype-dev libfontconfig-dev
      - name: Pinned Skia binaries
        run: crates/board-draw/skia-binaries.sh "$RUNNER_TEMP/skia"
      - name: Fallback fonts cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fallback-fonts
          key: fallback-fonts-${{ hashFiles('crates/board-draw/fallback-fonts.sha256') }}
      - name: Fallback fonts
        # Fetches what the cache lacks and checks every file against the checksum list.
        run: |
          crates/board-draw/fallback-fonts.sh "$RUNNER_TEMP/fallback-fonts"
          echo "BOARD_FALLBACK_FONTS=$RUNNER_TEMP/fallback-fonts" >> "$GITHUB_ENV"
      - run: cargo test --workspace --locked --no-fail-fast
      # The parity verdict's own tests (accepted differences, stale entries) live in the compare example.
      - run: cargo test -p board-draw --locked --example compare

  # The Rust board against the web player's own drawing, in headless Chromium, on a corpus of
  # synthetic board logs (crates/board-draw/README.md). The report, with the pictures side by side,
  # is kept as an artifact whether the check passes or not.
  parity:
    name: Render parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - name: Toolchain
        run: rustup toolchain install
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfreetype-dev libfontconfig-dev
      - name: Pinned Skia binaries
        run: crates/board-draw/skia-binaries.sh "$RUNNER_TEMP/skia"
      - name: Fallback fonts cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fallback-fonts
          key: fallback-fonts-${{ hashFiles('crates/board-draw/fallback-fonts.sha256') }}
      - name: Fallback fonts
        # Fetches what the cache lacks and checks every file against the checksum list.
        run: |
          crates/board-draw/fallback-fonts.sh "$RUNNER_TEMP/fallback-fonts"
          echo "BOARD_FALLBACK_FONTS=$RUNNER_TEMP/fallback-fonts" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Browser
        working-directory: crates/board-draw/parity
        run: |
          bun install --frozen-lockfile
          bunx playwright-core install --with-deps chromium
      - name: Parity
        env:
          PARITY_OUT: ${{ runner.temp }}/parity
        run: crates/board-draw/parity/run.sh
      - name: Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-parity-report
          path: ${{ runner.temp }}/parity/report.html
          if-no-files-found: warn
          retention-days: 30

  # The quiz and Quest screens against the player's own, with the generated colours, pictures, strings and
  # fixtures checked against the player's code (crates/quiz-draw/README.md).
  quiz-parity:
    name: Quiz parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Toolchain
        run: rustup toolchain install
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfreetype-dev libfontconfig-dev
      - name: Pinned Skia binaries
        run: crates/board-draw/skia-binaries.sh "$RUNNER_TEMP/skia"
      - name: Fallback fonts cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fallback-fonts
          key: fallback-fonts-${{ hashFiles('crates/board-draw/fallback-fonts.sha256') }}
      - name: Fallback fonts
        # Fetches what the cache lacks and checks every file against the checksum list.
        run: |
          crates/board-draw/fallback-fonts.sh "$RUNNER_TEMP/fallback-fonts"
          echo "BOARD_FALLBACK_FONTS=$RUNNER_TEMP/fallback-fonts" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Browser
        working-directory: crates/quiz-draw/parity
        run: |
          bun install --frozen-lockfile
          bunx playwright-core install --with-deps chromium
      - name: Parity
        env:
          PARITY_OUT: ${{ runner.temp }}/quiz-parity
        run: crates/quiz-draw/parity/run.sh
      - name: Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quiz-parity-report
          path: ${{ runner.temp }}/quiz-parity/report.html
          if-no-files-found: warn
          retention-days: 30

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo audit --deny warnings
      - run: cargo deny check

  # render.Dockerfile builds the worker and lesson-replay's page (the submodule); nothing is pushed.
  # One platform: the arm64 build differs only in the cross linker, which the release exercises.
  # No build cache: the build is from scratch, like a release's.
  render-image:
    name: Render image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          # The same pinned BuildKit daemon as the release.
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: render.Dockerfile
          platforms: linux/amd64
          push: false
