name: ci

# Formatting, lints, the test suite, a dependency audit and a build of the render image (so a broken
# page or worker build is caught before a tag, not by the release). Every cargo command uses --locked.
# The toolchain is the one in rust-toolchain.toml. Only the render image needs the submodules.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # image.yml runs the whole suite as the gate of a release.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Not ${{ github.workflow }}: called from image.yml that is the caller's name, which is also
  # the start of the caller's own concurrency group.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: Format and lints
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install
      - run: cargo test --workspace --locked --no-fail-fast

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo audit --deny warnings
      - run: cargo deny check

  # render.Dockerfile builds the worker and lesson-replay's page (the submodule); nothing is pushed.
  # One platform: the arm64 build differs only in the cross linker, which the release exercises.
  # No build cache: the build is from scratch, like a release's.
  render-image:
    name: Render image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          # The same pinned BuildKit daemon as the release.
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: render.Dockerfile
          platforms: linux/amd64
          push: false
