version: 2
updates:
  # The actions in .github/workflows are pinned to a commit; this moves the pins (the version
  # stays in the comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
  # The base images of Dockerfile and render.Dockerfile, pinned by digest (the docker ecosystem reads
  # every file whose name contains "Dockerfile").
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # render.Dockerfile pins ffmpeg to the exact version the worker was verified with (6.1.1 on
    # Ubuntu 24.04); Ubuntu 26.04 ships ffmpeg 8, so that move is made by hand, with a real render.
    ignore:
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major"]
  # The lesson-replay submodule (the render page): a pull request moves its pointer to the newest
  # commit of its default branch. The release refuses a pin that is not on that branch.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
