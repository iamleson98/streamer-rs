[workspace]
resolver = "3"
members = [
    "crates/stream-common",
    "crates/stream-runner",
    "crates/stream-render",
    "crates/replay-model",
    "crates/board-draw",
    "crates/stage-draw",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Every dependency is pinned to an exact version; Cargo.lock is committed and every build uses --locked.
[workspace.dependencies]
stream-common = { path = "crates/stream-common" }
replay-model = { path = "crates/replay-model" }
board-draw = { path = "crates/board-draw" }
stage-draw = { path = "crates/stage-draw" }
aws-lc-rs = "=1.19.0"
base64 = "=0.23.1"
nix = { version = "=0.32.0", default-features = false, features = ["signal"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "io-util", "sync", "fs", "net"] }
tokio-util = "=0.7.20"
tracing = "=0.1.44"
zeroize = "=1.9.1"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std", "env-filter"] }
axum = "=0.8.9"
tempfile = "=3.27.0"
bytes = "=1.12.1"
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
flate2 = "=1.1.11"
perfect_freehand = "=0.1.1"
unicode-segmentation = "=1.13.3"
# The features are the ones a prebuilt binary exists for (jpegd-jpege-pdf-textlayout); see board-draw/README.md.
skia-safe = { version = "=0.157.0", default-features = false, features = ["binary-cache", "embed-icudtl", "pdf", "jpeg", "textlayout"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake"] }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
